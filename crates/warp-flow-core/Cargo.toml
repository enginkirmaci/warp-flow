[package]
name = "warp-flow-core"
version = "0.1.83"
edition = "2024"
description = "The warp-flow engine: issue folder protocol, workflow graph, scheduler, gates"
license = "GPL-3.0"
repository = "https://github.com/enginkirmaci/warp-flow"
publish = false

[dependencies]
# kit line: pinned by tag, patched to kits/ by warp-suite's local build
warpui-kit-worktree = { git = "https://github.com/enginkirmaci/warp-suite", tag = "kits-v0.2.112", package = "warpui-kit-worktree" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
