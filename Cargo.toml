[package]
name = "warp-flow"
version = "0.1.54"
edition = "2024"
description = "warp-flow — workflow engine for the warp-suite"
license = "GPL-3.0"
repository = "https://github.com/enginkirmaci/warp-flow"
publish = false
# `cargo run` opens the app; the engine's headless driver is the second binary
default-run = "warp-flow"

# src/lib.rs is the probe boundary (tests/ build the real views); src/main.rs is
# a thin bootstrap over it. src/bin/warp-flow-cli.rs drives the same engine from
# a terminal, which the app cannot do until its run screen hosts the engine.
#
# The engine lives in crates/warp-flow-core; this crate is the desktop app.

[dependencies]
# kit line: pinned by tag, patched to kits/ by warp-suite's local build
warpui-kit-core = { git = "https://github.com/enginkirmaci/warp-suite", tag = "kits-v0.2.135", package = "warpui-kit-core" }
warpui-kit-markdown = { git = "https://github.com/enginkirmaci/warp-suite", tag = "kits-v0.2.135", package = "warpui-kit-markdown", features = ["all-languages"] }
# the task & diff screen draws patches with the family's renderer; the markdown
# kit pulls it in too, but a transitive dependency cannot be named in code
warpui-kit-diff = { git = "https://github.com/enginkirmaci/warp-suite", tag = "kits-v0.2.135", package = "warpui-kit-diff", features = ["all-languages"] }
warpui-kit-platform = { git = "https://github.com/enginkirmaci/warp-suite", tag = "kits-v0.2.135", package = "warpui-kit-platform" }

# the gpui stack, pinned here because the app builds standalone
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["wayland", "x11"] }
gpui-kit = "0.9"

# the engine
warp-flow-core = { path = "crates/warp-flow-core" }

# third-party
anyhow = "1"
# debug-embed: embed assets at compile time in debug builds too — without it
# rust-embed resolves "assets" against the process CWD at runtime, so the app
# only finds its icons when launched from the repo root
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"

[dev-dependencies]
# headless UI probes (tests/); feature-unifies with the normal gpui-kit dep
# only under `cargo test`
gpui-kit = { version = "0.9", features = ["test-support"] }

[build-dependencies]
warpui-kit-build = { git = "https://github.com/enginkirmaci/warp-suite", tag = "kits-v0.2.135", package = "warpui-kit-build" }

# Dev/test profile: line tables only.
#
# This must stay identical to warp-suite's root [profile.dev]: cargo keys a
# crate's fingerprint on the resolved profile, so a different debuginfo setting
# here makes every shared dependency compile a second time instead of reusing
# the artifact the suite build already put in the shared target directory.
# Full debuginfo=2 also puts ~1 GB of DWARF into the app binary and dominates
# link time. line-tables-only keeps file:line in panic backtraces — including
# gpui frames — at a fraction of the bytes, and [profile.test] inherits it, so
# the probes get the same treatment. Set debug = 2 here temporarily when a
# session needs gdb/lldb variable inspection; that rebuild only touches the dev
# fingerprints.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
