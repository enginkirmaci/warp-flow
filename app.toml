# Build and packaging facts read by the app's own build and release tooling.
[app]
package = "warp-flow"
icon_prefix = "warpflow"
notes = """
Workflow engine for the suite. Takes a request, distils it into an issue,
splits it into tasks and drives code, review, gates and merge through harness
sessions on warp-agent's door. Its record is the issue folder under .scratch/
in the target repository; its live state is published on a door of its own.
"""
