schema = 3
name = "implement"
revision = 1
max_parallel = 2

[[step]]
id = "analyze"
kind = "harness"
enabled = true
skill = "analyze"
harness = "dsh"
model = "opencode-go/deepseek-v4.1-flash"
effort = "max"
produces = "spec.md"
per_task = false
push = false

[[step]]
id = "approve-plan"
kind = "question"
enabled = true
per_task = false
push = false

[[step.edges]]
to = "analyze"
when = "answer_no"
max = 2

[[step]]
id = "code"
kind = "harness"
enabled = true
skill = "code"
harness = "dsh"
model = "opencode-go/deepseek-v4.1-flash"
effort = "max"
per_task = true
push = false

[[step]]
id = "review"
kind = "harness"
enabled = true
skill = "review"
harness = "dsh"
model = "opencode-go/deepseek-v4.1-flash"
effort = "high"
produces = "review.md"
per_task = true
push = false

[[step.edges]]
to = "code"
when = "verdict_changes"
max = 3

[[step]]
id = "fmt"
kind = "gate"
enabled = true
command = "cargo fmt --all --check && cargo fmt --all --manifest-path crates/warp-flow-core/Cargo.toml --check"
cwd = "."
timeout_secs = 300
depends_on = ["review"]
per_task = true
push = false

[[step]]
id = "clippy"
kind = "gate"
enabled = true
command = "cargo clippy --locked --all-targets -- -D warnings && cargo clippy --locked --all-targets -p warp-flow-core -- -D warnings"
cwd = "."
timeout_secs = 1800
depends_on = ["review"]
per_task = true
push = false

[[step]]
id = "test"
kind = "gate"
enabled = true
command = "cargo test --locked && cargo test --locked -p warp-flow-core"
cwd = "."
timeout_secs = 1800
depends_on = ["clippy"]
per_task = true
push = false

[[step.edges]]
to = "code"
when = "gate_failed"
max = 2

[[step]]
id = "bump"
kind = "gate"
enabled = true
command = "python3 scripts/bump.py"
cwd = "."
timeout_secs = 300
per_task = false
push = false

[[step]]
id = "merge"
kind = "merge"
enabled = true
per_task = true
mode = "local"
push = false
on_conflict = "resolve-conflict"
on_gate_failed = "fix-gates"

[[step]]
id = "resolve-conflict"
kind = "harness"
enabled = true
skill = "merge-conflict"
harness = "dsh"
model = "opencode-go/deepseek-v4.1-flash"
effort = "max"
depends_on = ["merge"]
per_task = true
push = false

[[step]]
id = "fix-gates"
kind = "harness"
enabled = true
skill = "code"
harness = "dsh"
model = "opencode-go/deepseek-v4.1-flash"
effort = "max"
depends_on = ["merge"]
per_task = true
push = false

[[step]]
id = "summary"
kind = "harness"
enabled = true
skill = "summary"
harness = "dsh"
model = "opencode-go/deepseek-v4.1-flash"
effort = "high"
depends_on = ["merge"]
produces = "summary.md"
per_task = false
push = false

[[step]]
id = "cleanup"
kind = "cleanup"
enabled = true
depends_on = ["merge"]
per_task = false
push = false
