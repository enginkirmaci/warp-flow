<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Warp Flow">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F3F4"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <!-- the flow: one node where a request arrives, two where it lands -->
    <g stroke="url(#g)" stroke-width="11" stroke-linecap="round">
      <path d="M46 58 84 39"/>
      <path d="M46 70 84 89"/>
    </g>
    <circle cx="35" cy="64" r="14" fill="url(#g)"/>
    <circle cx="95" cy="36" r="14" fill="url(#g)"/>
    <circle cx="95" cy="92" r="14" fill="#777A7D"/>
  </g>
</svg>
