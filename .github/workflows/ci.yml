name: ci

# This app's own gate: the desktop app pulls the kit and the GPUI stack from
# tags, so the GTK-free Wayland/X11 build packages are installed below.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config jq \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libvulkan-dev libfontconfig1-dev

      - name: Read the pinned channel
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
        id: toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Version consistency
        run: python3 scripts/version.py check

      - name: cargo fmt --check
        # The engine is a path dependency, not a workspace member (the suite
        # requires app manifests without `[workspace]`), so `--all` alone does
        # not reach it.
        run: |
          cargo fmt --all --check
          cargo fmt --all --manifest-path crates/warp-flow-core/Cargo.toml --check

      - name: cargo clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets -p warp-flow-core -- -D warnings

      - name: cargo test
        run: |
          cargo test --locked
          cargo test --locked -p warp-flow-core
